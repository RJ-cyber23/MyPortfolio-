<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Keep version and OS details out of error pages and headers.
    ServerSignature Off
</VirtualHost>
